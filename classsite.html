<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wheel of Names</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #f4f5f8; --card: #fff; --text: #1d2430; --muted: #667085;
    --accent: #1f6feb; --accent-text: #fff; --border: #e2e5ea; --danger: #d92d20;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11151b; --card: #1a2028; --text: #e6e9ee; --muted: #98a2b3;
      --accent: #4c8dff; --accent-text: #0b1220; --border: #2a323d; --danger: #f97066;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 16px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 1.3rem; margin: 0; margin-right: auto; }
  main { display: grid; grid-template-columns: 1fr 340px; gap: 16px; padding: 0 20px 20px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .wheel-wrap { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .stage { position: relative; width: min(78vh, 100%); aspect-ratio: 1; }
  canvas { width: 100%; height: 100%; display: block; }
  .pointer { position: absolute; top: 50%; right: -6px; transform: translateY(-50%);
    width: 0; height: 0; border-top: 18px solid transparent; border-bottom: 18px solid transparent;
    border-right: 34px solid var(--text); filter: drop-shadow(0 2px 2px rgba(0,0,0,.3)); }
  button, .filebtn { font: inherit; border: 1px solid var(--border); background: var(--card); color: var(--text);
    padding: 8px 14px; border-radius: 8px; cursor: pointer; }
  button:hover, .filebtn:hover { filter: brightness(.96); }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button.danger { color: var(--danger); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #spin { font-size: 1.15rem; padding: 12px 40px; }
  .filebtn input { display: none; }
  h2 { font-size: 1rem; margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; }
  .count { color: var(--muted); font-weight: normal; font-size: .9rem; }
  ul { list-style: none; margin: 0; padding: 0; max-height: 34vh; overflow: auto; }
  li { display: flex; gap: 8px; align-items: center; padding: 5px 4px; border-bottom: 1px solid var(--border); }
  li .id { color: var(--muted); font-size: .85rem; min-width: 72px; }
  li .nm { flex: 1; }
  li button { padding: 2px 8px; font-size: .8rem; }
  .side { display: flex; flex-direction: column; gap: 16px; }
  .hint { color: var(--muted); font-size: .85rem; margin: 6px 0 0; }
  .empty { color: var(--muted); padding: 8px 4px; }
  /* result dialog */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; place-items: center; z-index: 10; padding: 16px; }
  .overlay.show { display: grid; }
  .result { background: var(--card); border-radius: 16px; padding: 32px 28px; text-align: center; max-width: 520px; width: 100%; }
  .result .rid { color: var(--muted); font-size: 1.1rem; }
  .result .rname { font-size: 2.4rem; font-weight: 700; margin: 4px 0 24px; word-break: break-word; }
  .result .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  label.opt { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<header>
  <h1>Wheel of Names</h1>
  <label class="filebtn">Upload Excel / CSV<input type="file" id="file" accept=".xlsx,.xls,.csv,.txt"></label>
  <label class="opt"><input type="checkbox" id="showId"> Show IDs on wheel</label>
  <button id="resetBtn">Put everyone back</button>
  <button id="clearBtn" class="danger">Clear list</button>
</header>

<main>
  <div class="card wheel-wrap">
    <div class="stage">
      <canvas id="wheel" width="1000" height="1000"></canvas>
      <div class="pointer"></div>
    </div>
    <button id="spin" class="primary">Spin</button>
    <p class="hint" style="margin:0">Press <strong>Space</strong> to spin.</p>
  </div>

  <div class="side">
    <div class="card">
      <h2>On the wheel <span class="count" id="remCount"></span></h2>
      <ul id="remList"></ul>
    </div>
    <div class="card">
      <h2>Answered <span class="count" id="ansCount"></span></h2>
      <ul id="ansList"></ul>
    </div>
    <div class="card">
      <h2>Or paste names</h2>
      <textarea id="paste" rows="4" style="width:100%;font:inherit;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px" placeholder="One per line: ID, Name  (or copy two columns from Excel)"></textarea>
      <button id="pasteBtn" style="margin-top:8px">Load pasted list</button>
      <p class="hint">Column A = Student ID, column B = Name. A header row is skipped automatically.</p>
    </div>
  </div>
</main>

<div class="overlay" id="overlay">
  <div class="result">
    <div class="rid" id="rId"></div>
    <div class="rname" id="rName"></div>
    <div class="actions">
      <button class="primary" id="answeredBtn">Answered — remove</button>
      <button id="keepBtn">Keep on wheel</button>
    </div>
  </div>
</div>

<script>
const COLORS = ["#4C8DFF","#F97066","#32D583","#FDB022","#9E77ED","#2ED3B7","#F670C7","#FD853A","#6172F3","#66C61C"];
let students = [];   // {id, name, answered}
let rotation = 0;    // radians
let spinning = false;
let current = null;

const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const $ = id => document.getElementById(id);

function save() {
  try { localStorage.setItem('wheelStudents', JSON.stringify(students)); } catch (e) {}
}
function load() {
  try { const s = JSON.parse(localStorage.getItem('wheelStudents')); if (Array.isArray(s)) students = s; } catch (e) {}
}
const remaining = () => students.filter(s => !s.answered);

// ---------- parsing ----------
function rowsToStudents(rows) {
  const clean = rows
    .map(r => (r || []).map(c => String(c ?? '').trim()))
    .filter(r => r.some(c => c !== ''));
  if (!clean.length) return [];
  // skip header row if it looks like one
  const first = clean[0].join(' ').toLowerCase();
  if (/\b(id|name|student|admin|no\.?|s\/n|matric)\b/.test(first)) clean.shift();
  return clean.map(r => {
    if (r.length === 1 || r[1] === '') return { id: '', name: r[0], answered: false };
    return { id: r[0], name: r[1], answered: false };
  }).filter(s => s.name);
}

function setStudents(list) {
  if (!list.length) { alert('No names found. Check that column A is Student ID and column B is Name.'); return; }
  students = list; rotation = 0; save(); render();
}

$('file').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const isCsv = /\.(csv|txt)$/i.test(f.name);
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      let rows;
      if (isCsv && typeof XLSX === 'undefined') {
        rows = ev.target.result.split(/\r?\n/).map(l => l.split(/,|\t/));
      } else {
        if (typeof XLSX === 'undefined') { alert('The Excel reader needs internet the first time. Save the sheet as CSV, or paste the two columns instead.'); return; }
        const wb = isCsv ? XLSX.read(ev.target.result, { type: 'string' }) : XLSX.read(ev.target.result, { type: 'array' });
        rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false });
      }
      setStudents(rowsToStudents(rows));
    } catch (err) { alert('Could not read that file: ' + err.message); }
  };
  isCsv ? reader.readAsText(f) : reader.readAsArrayBuffer(f);
  e.target.value = '';
});

$('pasteBtn').addEventListener('click', () => {
  const rows = $('paste').value.split(/\r?\n/).map(l => l.includes('\t') ? l.split('\t') : l.split(','));
  setStudents(rowsToStudents(rows));
  $('paste').value = '';
});

// ---------- drawing ----------
function label(s) { return $('showId').checked && s.id ? `${s.id}  ${s.name}` : s.name; }

function draw() {
  const list = remaining();
  const W = canvas.width, c = W / 2, r = c - 10;
  ctx.clearRect(0, 0, W, W);
  if (!list.length) {
    ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--border');
    ctx.beginPath(); ctx.arc(c, c, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--muted');
    ctx.font = '600 40px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(students.length ? 'Everyone has answered' : 'Upload a class list', c, c);
    return;
  }
  const n = list.length, seg = Math.PI * 2 / n;
  const fontSize = Math.max(14, Math.min(44, 900 / n + 8));
  list.forEach((s, i) => {
    const a0 = rotation + i * seg;
    ctx.beginPath(); ctx.moveTo(c, c); ctx.arc(c, c, r, a0, a0 + seg); ctx.closePath();
    ctx.fillStyle = n === 1 ? COLORS[0] : COLORS[i % COLORS.length];
    if (n > 1 && i === n - 1 && n % COLORS.length === 1) ctx.fillStyle = COLORS[5];
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.save();
    ctx.translate(c, c); ctx.rotate(a0 + seg / 2);
    ctx.fillStyle = '#fff'; ctx.font = `600 ${fontSize}px system-ui`;
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    let t = label(s); const maxW = r - 90;
    while (ctx.measureText(t).width > maxW && t.length > 3) t = t.slice(0, -2);
    if (t !== label(s)) t = t.slice(0, -1) + '…';
    ctx.fillText(t, r - 24, 0);
    ctx.restore();
  });
  ctx.beginPath(); ctx.arc(c, c, 46, 0, Math.PI * 2);
  ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = 'rgba(0,0,0,.15)'; ctx.lineWidth = 4; ctx.stroke();
}

function renderLists() {
  const rem = remaining(), ans = students.filter(s => s.answered);
  $('remCount').textContent = rem.length;
  $('ansCount').textContent = ans.length;
  const row = (s, btnText, fn) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="id"></span><span class="nm"></span><button></button>`;
    li.querySelector('.id').textContent = s.id;
    li.querySelector('.nm').textContent = s.name;
    const b = li.querySelector('button'); b.textContent = btnText; b.onclick = fn;
    return li;
  };
  const rl = $('remList'), al = $('ansList'); rl.innerHTML = ''; al.innerHTML = '';
  if (!rem.length) rl.innerHTML = '<div class="empty">No one left.</div>';
  if (!ans.length) al.innerHTML = '<div class="empty">No one yet.</div>';
  rem.forEach(s => rl.appendChild(row(s, 'Remove', () => { s.answered = true; save(); render(); })));
  ans.forEach(s => al.appendChild(row(s, 'Put back', () => { s.answered = false; save(); render(); })));
  $('spin').disabled = rem.length === 0;
}

function render() { draw(); renderLists(); }

// ---------- spinning ----------
function spin() {
  const list = remaining();
  if (spinning || !list.length) return;
  spinning = true; $('spin').disabled = true;
  const n = list.length, seg = Math.PI * 2 / n;
  const pick = Math.floor(Math.random() * n);
  // pointer at angle 0 (right side): want centre of pick segment at angle 0
  const jitter = (Math.random() - 0.5) * seg * 0.7;
  let target = -(pick * seg + seg / 2) + jitter;
  const start = rotation;
  const base = ((target - start) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
  const end = start + base + Math.PI * 2 * (5 + Math.floor(Math.random() * 3));
  const dur = 4500 + Math.random() * 1000, t0 = performance.now();
  const ease = t => 1 - Math.pow(1 - t, 4);
  function frame(now) {
    const t = Math.min(1, (now - t0) / dur);
    rotation = start + (end - start) * ease(t);
    draw();
    if (t < 1) requestAnimationFrame(frame);
    else {
      rotation = end % (Math.PI * 2);
      spinning = false; current = list[pick]; showResult(current);
    }
  }
  requestAnimationFrame(frame);
}

function showResult(s) {
  $('rId').textContent = s.id ? s.id : '';
  $('rName').textContent = s.name;
  $('overlay').classList.add('show');
}
function closeResult(remove) {
  if (current && remove) { current.answered = true; save(); }
  current = null; $('overlay').classList.remove('show'); render();
}

$('spin').onclick = spin;
$('answeredBtn').onclick = () => closeResult(true);
$('keepBtn').onclick = () => closeResult(false);
$('showId').onchange = draw;
$('resetBtn').onclick = () => { students.forEach(s => s.answered = false); save(); render(); };
$('clearBtn').onclick = () => { if (confirm('Remove the whole class list?')) { students = []; save(); render(); } };
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA') return;
  if (e.code === 'Space') { e.preventDefault(); $('overlay').classList.contains('show') ? closeResult(true) : spin(); }
  if (e.code === 'Escape' && $('overlay').classList.contains('show')) closeResult(false);
});

load(); render();
</script>
</body>
</html>
